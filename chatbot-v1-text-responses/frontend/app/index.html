<title>MyAI - AI Assistant</title>

<style>

    }

    /* SIDEBAR */

    .logo {

        font-size: 20px;

    }

    .logo-icon {

        background: #111827;
        color: white;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
    }

    .new-chat {
        width: 100%;

        cursor: pointer;

        font-size: 14px;
    }

        background: #eeeeee;
    }

    .history {
        margin-top: 25px;
    }

    .history-title {
        font-size: 12px;

    .history-item {

        white-space: nowrap;

        text-overflow: ellipsis;
    }

    .history-item:hover {
        background: #e8e8e8;
    }

    .sidebar-bottom {
        margin-top: auto;
    }

    .sidebar-button {
        padding: 10px;
        font-size: 14px;
        color: #555;
    }

    /* MAIN */

    .main {

        display: flex;
        flex-direction: column;

    }

    /* CHAT */

    .chat {

    .message {

    .avatar {

        font-size: 13px;

    }

    .user-avatar {

        color: white;
    }

    .ai-avatar {
        background: #e8e8e8;
    }

    .message-content {

    }

    .message-name {

        font-size: 13px;
        margin-bottom: 7px;
    }

    .message-text {

        line-height: 1.7;

    }

    /* WELCOME */

    .welcome {
        max-width: 700px;
        margin: 80px auto;
        text-align: center;
    }

    .welcome-icon {
        width: 65px;
        height: 65px;
        margin: auto;
        border-radius: 18px;

        color: white;
        display: flex;
        align-items: center;

    .welcome p {

    .suggestions {

        margin-top: 30px;

        border: 1px solid #ddd;
        border-radius: 10px;
        text-align: left;
        cursor: pointer;

    .suggestion:hover {
        background: #f6f6f6;
    }

    /* INPUT */

    .input-container {
        position: fixed;
        bottom: 0;
        left: 260px;
        right: 0;
        padding: 20px;
        background: linear-gradient(
            transparent,
            white 35%
        );
    }

    .input-wrapper {

        margin: auto;
        border: 1px solid #ccc;

        align-items: flex-end;

        resize: none;
        font-size: 15px;

    }

    .send {
        width: 38px;
        height: 38px;

    }

    .send:disabled {
        opacity: 0.3;
        cursor: default;
    }

    .notice {
        text-align: center;
        color: #888;
        font-size: 11px;
        margin-top: 8px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

        .sidebar {
            display: none;
        }

        .input-container {
            left: 0;
        }

        .suggestions {
            grid-template-columns: 1fr;
        }
    }

</style>

</div>

<script>

    /*
       IMPORTANT:

       If you are opening this website from another laptop,
       change this address to the IP address of the computer
       running your Python backend.

       Example:

       http://192.168.1.25:8000/chat
    */

    const API_URL = "http://localhost:8000/chat";


    let messages = [];


    function useSuggestion(text) {

        document.getElementById("input").value = text;

        document.getElementById("input").focus();

    }


    function handleKey(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }


    async function sendMessage() {

        const input =
            document.getElementById("input");

        const sendButton =
            document.getElementById("sendButton");

        const text =
            input.value.trim();


        if (!text) {
            return;
        }


        // Hide welcome screen

        document.getElementById("welcome").style.display =
            "none";


        // Add user message

        messages.push({
            role: "user",
            content: text
        });


        addMessage(
            "You",
            text,
            "user"
        );


        input.value = "";

        sendButton.disabled = true;


        // Show typing indicator

        const typing =
            document.createElement("div");

        typing.className = "message";

        typing.id = "typing";

        typing.innerHTML = `
            <div class="avatar ai-avatar">✦</div>
            <div class="message-content">
                <div class="message-name">MyAI</div>
                <div class="message-text">
                    Thinking...
                </div>
            </div>
        `;

        document
            .getElementById("messages")
            .appendChild(typing);


        scrollToBottom();


        try {

            const response =
                await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        messages: messages
                    })

                });


            if (!response.ok) {

                throw new Error(
                    "Server returned an error"
                );

            }


            const data =
                await response.json();


            // Remove typing

            document
                .getElementById("typing")
                ?.remove();


            // Add AI message

            messages.push({

                role: "assistant",

                content: data.response

            });


            addMessage(
                "MyAI",
                data.response,
                "ai"
            );


            updateHistory(text);


        } catch (error) {

            console.error(error);


            document
                .getElementById("typing")
                ?.remove();


            addMessage(
                "MyAI",
                "Unable to connect to the AI server. Please make sure the Python backend is running.",
                "ai"
            );

        }


        sendButton.disabled = false;

        input.focus();

        scrollToBottom();

    }


    function addMessage(
        name,
        text,
        type
    ) {

        const container =
            document.getElementById("messages");


        const message =
            document.createElement("div");

        message.className = "message";


        const avatar =
            type === "user"
                ? "U"
                : "✦";


        const avatarClass =
            type === "user"
                ? "user-avatar"
                : "ai-avatar";


        message.innerHTML = `

            <div class="avatar ${avatarClass}">
                ${avatar}
            </div>

            <div class="message-content">

                <div class="message-name">
                    ${name}
                </div>

                <div class="message-text"></div>

            </div>
        `;


        message
            .querySelector(".message-text")
            .textContent = text;


        container.appendChild(message);


        scrollToBottom();

    }


    function updateHistory(text) {

        const list =
            document.getElementById(
                "historyList"
            );


        if (
            list.children.length >= 10
        ) {

            return;

        }


        const item =
            document.createElement("div");


        item.className =
            "history-item";


        item.textContent =
            text.substring(0, 35);


        list.appendChild(item);

    }


    function newChat() {

        messages = [];


        document.getElementById(
            "messages"
        ).innerHTML = "";


        document.getElementById(
            "welcome"
        ).style.display = "block";


        document.getElementById(
            "input"
        ).value = "";

    }


    function scrollToBottom() {

        const chat =
            document.getElementById("chat");

        chat.scrollTop =
            chat.scrollHeight;

    }

</script>

</body>
</html>
