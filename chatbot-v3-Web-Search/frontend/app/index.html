<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyAI V3</title>


    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


    <!-- Syntax highlighting -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #ffffff;

            color: #202123;

            height: 100vh;

            overflow: hidden;
        }


        /* ======================================================
           APP
        ====================================================== */

        .app {

            display: flex;

            height: 100vh;

            width: 100%;
        }


        /* ======================================================
           SIDEBAR
        ====================================================== */

        .sidebar {

            width: 260px;

            background: #f7f7f8;

            border-right: 1px solid #e5e5e5;

            display: flex;

            flex-direction: column;

            padding: 12px;
        }


        .brand {

            font-size: 20px;

            font-weight: 700;

            padding: 12px;

            margin-bottom: 8px;
        }


        .new-chat {

            width: 100%;

            padding: 12px;

            border: 1px solid #d9d9e3;

            border-radius: 8px;

            background: #ffffff;

            cursor: pointer;

            font-size: 14px;

            margin-bottom: 12px;
        }


        .new-chat:hover {

            background: #ececf1;
        }


        .history {

            flex: 1;

            overflow-y: auto;
        }


        .history-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 10px;

            margin-bottom: 4px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }


        .history-item:hover {

            background: #ececf1;
        }


        .history-item.active {

            background: #e5e5e5;
        }


        .history-title {

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            flex: 1;
        }


        .delete-chat {

            border: none;

            background: transparent;

            cursor: pointer;

            opacity: 0;

            font-size: 14px;
        }


        .history-item:hover .delete-chat {

            opacity: 1;
        }


        /* ======================================================
           MAIN
        ====================================================== */

        .main {

            flex: 1;

            display: flex;

            flex-direction: column;

            min-width: 0;
        }


        /* ======================================================
           HEADER
        ====================================================== */

        .header {

            height: 60px;

            border-bottom: 1px solid #e5e5e5;

            display: flex;

            align-items: center;

            padding: 0 20px;

            font-weight: 600;

            font-size: 17px;
        }


        .version {

            margin-left: 8px;

            font-size: 12px;

            background: #f0f0f0;

            padding: 3px 7px;

            border-radius: 5px;

            color: #666;
        }


        /* ======================================================
           CHAT
        ====================================================== */

        .chat-container {

            flex: 1;

            overflow-y: auto;

            padding: 30px 20px;
        }


        .messages {

            max-width: 900px;

            margin: 0 auto;
        }


        .message {

            display: flex;

            margin-bottom: 25px;

            line-height: 1.6;
        }


        .message.user {

            justify-content: flex-end;
        }


        .message-content {

            max-width: 80%;

            padding: 12px 16px;

            border-radius: 12px;

            overflow-wrap: break-word;
        }


        .message.user .message-content {

            background: #f0f0f0;
        }


        .message.assistant .message-content {

            background: transparent;

            width: 100%;
        }


        /* ======================================================
           MARKDOWN
        ====================================================== */

        .message-content p {

            margin-top: 0;

            margin-bottom: 12px;
        }


        .message-content p:last-child {

            margin-bottom: 0;
        }


        .message-content pre {

            position: relative;

            background: #1e1e1e;

            color: #ffffff;

            padding: 16px;

            border-radius: 8px;

            overflow-x: auto;

            margin-top: 12px;

            margin-bottom: 12px;
        }


        .message-content code {

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 13px;
        }


        .message-content :not(pre) > code {

            background: #f0f0f0;

            padding: 2px 5px;

            border-radius: 4px;

            color: #d63384;
        }


        /* ======================================================
           COPY BUTTON
        ====================================================== */

        .copy-button {

            position: absolute;

            right: 8px;

            top: 8px;

            border: 1px solid #555;

            background: #333;

            color: white;

            border-radius: 5px;

            padding: 5px 8px;

            font-size: 11px;

            cursor: pointer;
        }


        .copy-button:hover {

            background: #444;
        }


        /* ======================================================
           WEB SEARCH STATUS
        ====================================================== */

        .search-status {

            max-width: 900px;

            margin: 0 auto 15px auto;

            padding: 8px 14px;

            border-radius: 8px;

            background: #f7f7f8;

            color: #555;

            font-size: 13px;

            display: none;

            align-items: center;

            gap: 8px;
        }


        .search-dot {

            width: 7px;

            height: 7px;

            background: #555;

            border-radius: 50%;

            animation: pulse 1s infinite;
        }


        @keyframes pulse {

            0% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.3;
            }
        }


        /* ======================================================
           INPUT AREA
        ====================================================== */

        .input-area {

            padding: 15px 20px 20px;

            border-top: 1px solid #e5e5e5;
        }


        .input-wrapper {

            max-width: 900px;

            margin: 0 auto;

            position: relative;
        }


        textarea {

            width: 100%;

            min-height: 52px;

            max-height: 200px;

            resize: none;

            border: 1px solid #d9d9e3;

            border-radius: 12px;

            padding: 15px 55px 15px 15px;

            font-family: inherit;

            font-size: 15px;

            outline: none;
        }


        textarea:focus {

            border-color: #999;
        }


        .send-button {

            position: absolute;

            right: 10px;

            bottom: 10px;

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 8px;

            background: #202123;

            color: white;

            cursor: pointer;
        }


        .send-button:disabled {

            opacity: 0.4;

            cursor: default;
        }


        .stop-button {

            display: none;

            position: absolute;

            right: 10px;

            bottom: 10px;

            width: 35px;

            height: 35px;

            border: none;

            border-radius: 8px;

            background: #555;

            color: white;

            cursor: pointer;
        }


        .disclaimer {

            text-align: center;

            font-size: 11px;

            color: #888;

            margin-top: 8px;
        }


        /* ======================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .sidebar {

                display: none;
            }

            .message-content {

                max-width: 92%;
            }

            .chat-container {

                padding: 20px 12px;
            }

            .input-area {

                padding: 10px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- ======================================================
         SIDEBAR
         ====================================================== -->

    <aside class="sidebar">

        <div class="brand">
            MyAI
        </div>


        <button
            class="new-chat"
            onclick="newChat()"
        >
            + New Chat
        </button>


        <div
            class="history"
            id="history"
        ></div>

    </aside>



    <!-- ======================================================
         MAIN
         ====================================================== -->

    <main class="main">


        <header class="header">

            MyAI

            <span class="version">
                V3
            </span>

        </header>



        <!-- ==================================================
             CHAT
             ================================================== -->

        <div class="chat-container">

            <div
                class="messages"
                id="messages"
            ></div>


            <!-- ==================================================
                 WEB SEARCH STATUS
                 ================================================== -->

            <div
                class="search-status"
                id="searchStatus"
            >

                <span class="search-dot"></span>

                <span id="searchText">
                    Searching the web...
                </span>

            </div>

        </div>



        <!-- ==================================================
             INPUT
             ================================================== -->

        <div class="input-area">

            <div class="input-wrapper">


                <textarea
                    id="input"
                    placeholder="Message MyAI..."
                    rows="1"
                ></textarea>


                <button
                    class="send-button"
                    id="sendButton"
                    onclick="sendMessage()"
                >
                    ↑
                </button>


                <button
                    class="stop-button"
                    id="stopButton"
                    onclick="stopGeneration()"
                >
                    ■
                </button>

            </div>


            <div class="disclaimer">

                MyAI V3 can search the web when current information is needed.

            </div>

        </div>


    </main>

</div>



<script>


// ============================================================
// API
// ============================================================

const API_URL = "http://localhost:8003/chat";


// ============================================================
// STATE
// ============================================================

let chats = [];

let currentChatId = null;

let controller = null;


// ============================================================
// ELEMENTS
// ============================================================

const input = document.getElementById("input");

const messagesDiv =
    document.getElementById("messages");

const historyDiv =
    document.getElementById("history");

const sendButton =
    document.getElementById("sendButton");

const stopButton =
    document.getElementById("stopButton");

const searchStatus =
    document.getElementById("searchStatus");

const searchText =
    document.getElementById("searchText");


// ============================================================
// LOAD CHATS
// ============================================================

function loadChats() {

    const saved =
        localStorage.getItem("myai_v3_chats");

    if (saved) {

        try {

            chats = JSON.parse(saved);

        } catch {

            chats = [];

        }

    }


    if (chats.length > 0) {

        currentChatId = chats[0].id;

        renderHistory();

        loadChat(currentChatId);

    } else {

        newChat();

    }

}


// ============================================================
// SAVE CHATS
// ============================================================

function saveChats() {

    localStorage.setItem(
        "myai_v3_chats",
        JSON.stringify(chats)
    );

}


// ============================================================
// NEW CHAT
// ============================================================

function newChat() {

    const chat = {

        id: Date.now(),

        title: "New Chat",

        messages: []

    };


    chats.unshift(chat);

    currentChatId = chat.id;

    saveChats();

    renderHistory();

    renderMessages();

}


// ============================================================
// CURRENT CHAT
// ============================================================

function getCurrentChat() {

    return chats.find(
        chat => chat.id === currentChatId
    );

}


// ============================================================
// RENDER HISTORY
// ============================================================

function renderHistory() {

    historyDiv.innerHTML = "";


    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            "history-item" +
            (chat.id === currentChatId
                ? " active"
                : "");


        const title =
            document.createElement("div");

        title.className =
            "history-title";

        title.textContent =
            chat.title;


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-chat";

        deleteButton.textContent =
            "×";


        deleteButton.onclick =
            function(event) {

                event.stopPropagation();

                deleteChat(chat.id);

            };


        item.appendChild(title);

        item.appendChild(deleteButton);


        item.onclick =
            function() {

                loadChat(chat.id);

            };


        historyDiv.appendChild(item);

    });

}


// ============================================================
// LOAD CHAT
// ============================================================

function loadChat(id) {

    currentChatId = id;

    renderHistory();

    renderMessages();

}


// ============================================================
// DELETE CHAT
// ============================================================

function deleteChat(id) {

    chats =
        chats.filter(
            chat => chat.id !== id
        );


    if (chats.length === 0) {

        newChat();

        return;

    }


    if (currentChatId === id) {

        currentChatId =
            chats[0].id;

    }


    saveChats();

    renderHistory();

    renderMessages();

}


// ============================================================
// RENDER MESSAGES
// ============================================================

function renderMessages() {

    messagesDiv.innerHTML = "";


    const chat =
        getCurrentChat();


    if (!chat) {

        return;

    }


    chat.messages.forEach(message => {

        addMessageToUI(
            message.role,
            message.content
        );

    });


    scrollToBottom();

}


// ============================================================
// ADD MESSAGE
// ============================================================

function addMessageToUI(
    role,
    content
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const messageContent =
        document.createElement("div");

    messageContent.className =
        "message-content";


    if (role === "assistant") {

        messageContent.innerHTML =
            marked.parse(content || "");

        addCopyButtons(
            messageContent
        );

        highlightCode(
            messageContent
        );

    } else {

        messageContent.textContent =
            content;

    }


    message.appendChild(
        messageContent
    );


    messagesDiv.appendChild(
        message
    );


    return messageContent;

}


// ============================================================
// MARKDOWN
// ============================================================

function renderAssistantContent(
    element,
    content
) {

    element.innerHTML =
        marked.parse(content);

    addCopyButtons(element);

    highlightCode(element);

}


// ============================================================
// CODE HIGHLIGHT
// ============================================================

function highlightCode(
    container
) {

    container
        .querySelectorAll("pre code")
        .forEach(block => {

            hljs.highlightElement(
                block
            );

        });

}


// ============================================================
// COPY CODE BUTTONS
// ============================================================

function addCopyButtons(
    container
) {

    container
        .querySelectorAll("pre")
        .forEach(pre => {

            if (
                pre.querySelector(
                    ".copy-button"
                )
            ) {

                return;

            }


            const button =
                document.createElement("button");

            button.className =
                "copy-button";

            button.textContent =
                "Copy";


            button.onclick =
                async function() {

                    const code =
                        pre.querySelector(
                            "code"
                        );

                    if (!code) {

                        return;

                    }


                    await navigator
                        .clipboard
                        .writeText(
                            code.innerText
                        );


                    button.textContent =
                        "Copied";


                    setTimeout(
                        () => {
                            button.textContent =
                                "Copy";
                        },
                        1500
                    );

                };


            pre.appendChild(button);

        });

}


// ============================================================
// SEND MESSAGE
// ============================================================

async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    const chat =
        getCurrentChat();


    if (!chat) {

        return;

    }


    // --------------------------------------------------------
    // USER MESSAGE
    // --------------------------------------------------------

    chat.messages.push({

        role: "user",

        content: text

    });


    if (
        chat.title === "New Chat"
    ) {

        chat.title =
            text.substring(0, 40);

    }


    input.value = "";

    autoResize();


    saveChats();

    renderHistory();


    // --------------------------------------------------------
    // ADD USER MESSAGE
    // --------------------------------------------------------

    addMessageToUI(
        "user",
        text
    );


    // --------------------------------------------------------
    // ASSISTANT MESSAGE
    // --------------------------------------------------------

    const assistantElement =
        addMessageToUI(
            "assistant",
            ""
        );


    scrollToBottom();


    // --------------------------------------------------------
    // UI STATE
    // --------------------------------------------------------

    sendButton.style.display =
        "none";

    stopButton.style.display =
        "block";


    controller =
        new AbortController();


    // --------------------------------------------------------
    // WEB SEARCH STATUS
    // --------------------------------------------------------

    hideSearchStatus();


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        messages:
                            chat.messages

                    }),

                    signal:
                        controller.signal
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP error " +
                response.status
            );

        }


        if (!response.body) {

            throw new Error(
                "Streaming is not supported."
            );

        }


        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder();


        let buffer = "";

        let assistantText = "";


        // ----------------------------------------------------
        // READ STREAM
        // ----------------------------------------------------

        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {

                break;

            }


            buffer +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            const events =
                buffer.split("\n\n");


            buffer =
                events.pop();


            for (
                const eventText
                of events
            ) {

                const line =
                    eventText
                        .split("\n")
                        .find(
                            line =>
                                line.startsWith(
                                    "data:"
                                )
                        );


                if (!line) {

                    continue;

                }


                const jsonText =
                    line
                        .substring(5)
                        .trim();


                if (!jsonText) {

                    continue;

                }


                let data;


                try {

                    data =
                        JSON.parse(
                            jsonText
                        );

                } catch {

                    continue;

                }


                // --------------------------------------------
                // NORMAL TEXT
                // --------------------------------------------

                if (
                    data.type === "delta"
                ) {

                    assistantText +=
                        data.text;


                    renderAssistantContent(
                        assistantElement,
                        assistantText
                    );


                    scrollToBottom();

                }


                // --------------------------------------------
                // WEB SEARCH START
                // --------------------------------------------

                else if (
                    data.type ===
                    "search_start"
                ) {

                    showSearchStatus(
                        "Searching the web..."
                    );

                }


                // --------------------------------------------
                // WEB SEARCHING
                // --------------------------------------------

                else if (
                    data.type ===
                    "searching"
                ) {

                    showSearchStatus(
                        "Searching the web..."
                    );

                }


                // --------------------------------------------
                // WEB SEARCH COMPLETE
                // --------------------------------------------

                else if (
                    data.type ===
                    "search_complete"
                ) {

                    showSearchStatus(
                        "Reading search results..."
                    );

                }


                // --------------------------------------------
                // COMPLETE
                // --------------------------------------------

                else if (
                    data.type === "done"
                ) {

                    hideSearchStatus();

                }


                // --------------------------------------------
                // ERROR
                // --------------------------------------------

                else if (
                    data.type === "error"
                ) {

                    throw new Error(
                        data.message
                    );

                }

            }

        }


        // ----------------------------------------------------
        // SAVE ASSISTANT MESSAGE
        // ----------------------------------------------------

        if (assistantText) {

            chat.messages.push({

                role: "assistant",

                content:
                    assistantText

            });

        }


        saveChats();


    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            // User stopped generation.

            if (assistantText) {

                chat.messages.push({

                    role: "assistant",

                    content:
                        assistantText

                });

            }

            saveChats();

        } else {

            assistantElement.innerHTML =
                `<p><strong>Error:</strong> ${
                    escapeHtml(
                        error.message
                    )
                }</p>`;

        }

    } finally {

        sendButton.style.display =
            "block";

        stopButton.style.display =
            "none";

        controller = null;

        hideSearchStatus();

    }

}


// ============================================================
// STOP GENERATION
// ============================================================

function stopGeneration() {

    if (controller) {

        controller.abort();

    }

}


// ============================================================
// SEARCH STATUS
// ============================================================

function showSearchStatus(
    text
) {

    searchStatus.style.display =
        "flex";

    searchText.textContent =
        text;

}


function hideSearchStatus() {

    searchStatus.style.display =
        "none";

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


// ============================================================
// SCROLL
// ============================================================

function scrollToBottom() {

    const container =
        document.querySelector(
            ".chat-container"
        );


    container.scrollTop =
        container.scrollHeight;

}


// ============================================================
// TEXTAREA
// ============================================================

input.addEventListener(
    "input",
    autoResize
);


function autoResize() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            200
        ) + "px";

}


// ============================================================
// ENTER TO SEND
// ============================================================

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// ============================================================
// START
// ============================================================

loadChats();

</script>


</body>

</html>
